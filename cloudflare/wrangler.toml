name = "folia-cf-virus"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# workers_dev must be explicit once routes are declared, or the workers.dev
# preview url is turned off -- which is the url used to check this worker
# before and after a change.
workers_dev = true

# The hostnames this worker answers on. custom_domain means Cloudflare owns the
# DNS record and the certificate. Recorded here so the repo, not a dashboard,
# says which worker serves which hostname -- and so the binding is recreated if
# the worker ever is.
routes = [
  { pattern = "virus.folia.app", custom_domain = true },
]

[assets]
directory = "../public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[alias]
dotenv = "./src/shims/dotenv.js"

[vars]
# Copied from the Netlify site config. CANONICAL_DOMAIN is the base of the
# image urls this endpoint publishes, so it has to match exactly.
#
# OPENSEA_API_KEY is deliberately absent: the function reads it for a Base
# owner lookup, but it is not set on the Netlify site either, so that path is
# already inert. Setting one here would be a behaviour change, not parity --
# and it is a secret, which does not belong in this file in any case.
VUE_APP_CANONICAL_DOMAIN = "https://virus.folia.app"
VUE_APP_DEV_IGNORE_IS_OWNED = "true"
